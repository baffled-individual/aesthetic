</style></head><body data-m="light" data-p="cream"><main id="app"></main><nav id="nav"></nav><div id="toast" role="status"></div><script>
const OLD="bafflingGymSetup_v1",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- IndexedDB wrapper ----

 get(k){return this.tx("readonly",s=>s.get(k))},set(k,v){return this.tx("readwrite",s=>s.put(v,k))},clear(){return this.tx("readwrite",s=>s.clear())},del(k){return this.tx("readwrite",s=>s.delete(k))}};
const blank=()=>({v:1,onboarded:false,name:"",units:"kg",mode:"light",palette:"cream",rest:90,days:[],done:[],sess:[],active:null,notes:[],weights:[],heights:[],fats:[],photos:[],avatar:null});
let pt="weight",pfl="",cmpSel=[],S=blank(),tab="home",ob=0,calM=new Date(),calSel=today(),edit=null,tm={mode:"cd",run:false,end:0,left:90000,start:0,el:0,iv:{w:30,r:15,n:8}},tick=null;

function ask(msg,ok="Confirm"){return new Promise(r=>{let o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:99;animation:fade .2s";o.innerHTML=`<div class="card" role="dialog" aria-modal="true" style="max-width:420px;width:100%;background:var(--bg)"><p style="white-space:pre-wrap;margin-top:0">${esc(msg)}</p><div class="row"><button data-x="0">Cancel</button><button class="p" data-x="1">${esc(ok)}</button></div></div>`;o.onclick=e=>{let b=e.target.closest("[data-x]");if(!b&&e.target!==o)return;o.remove();r(!!b&&b.dataset.x==="1")};document.body.append(o);o.querySelector('[data-x="0"]').focus()})}

async function init(){await DB.open();matchMedia("(prefers-color-scheme:dark)").addEventListener("change",theme);let s=await DB.get("state");if(s)S={...blank(),...s};else{try{let o=JSON.parse(localStorage.getItem(OLD)||"null");if(o&&o.setup?.workouts?.length){let u=o.setup;S={...blank(),onboarded:true,name:u.name||"",mode:u.mode||"light",palette:u.palette||"cream",days:u.workouts.map(w=>({name:w.name,items:w.items.map(n=>({n}))})),done:o.completedDays||[],sess:(o.history||[]).map(h=>({id:h.id,date:h.date,day:h.workoutName,legacy:true,items:(h.items||[]).map(n=>({n,sets:[]})),at:h.completedAt}))};await save()}}catch(e){}}theme();render()}
// ---- helpers ----
const nextDay=()=>{let i=S.days.findIndex((_,i)=>!S.done.includes(i));return i};
const sessFor=i=>{if(S.active&&S.active.day===i)return S.active;return null};
function startWorkout(i){S.active={day:i,name:S.days[i].name,t0:Date.now(),items:S.days[i].items.map(x=>({n:x.n,ok:false}))};save();tab="workout";render()}
function finish(){let a=S.active;S.sess.unshift({id:Date.now()+"",date:today(),day:a.name,dayIdx:a.day,dur:Math.round((Date.now()-a.t0)/60000),items:a.items,at:new Date().toISOString()});if(!S.done.includes(a.day))S.done.push(a.day);S.active=null;save();toast("Saved");tab="calendar";calSel=today();render()}
// ---- views ----
const V={};
V.home=()=>{let i=nextDay(),w=S.days[i],a=S.active,wk=S.sess.filter(s=>(Date.now()-new Date(s.date))<7*864e5).length,h=new Date().getHours();
 return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h1>${h<12?"Good morning":h<18?"Good afternoon":"Good evening"}${S.name?", "+esc(S.name):""}</h1><p class="mu">${dl(today())}</p></div>${avEl(52)}</div>
 <div class="card" style="text-align:center">${!S.days.length?`<p>No plan yet. Build one in More → Workout Builder.</p>`:i<0?`<h2>Cycle complete</h2><p class="mu">Every day is done. Start a new cycle — history is kept.</p><button class="p" data-a="cycle">Start new cycle</button><button data-t="workout" style="margin-top:10px;width:100%">Choose a day</button>`:`<span class="mu">${a?"In progress":"Suggested next"}</span><h2>${esc(w.name)}</h2><p class="mu">${w.items.length} exercises</p>${a?`<div class="bar"><i style="width:${Math.round(a.items.filter(x=>x.ok).length/a.items.length*100)}%"></i></div><br>`:""}<button class="p" data-a="${a?"go":"start"}" data-i="${i}">${a?"Continue Workout":"Start Workout"}</button>${a?"":'<button data-t="workout" style="margin-top:10px;width:100%">Choose a different day</button>'}`}</div>
 <div class="card" style="text-align:center"><b>📅 This week</b><p class="mu">${wk} session${wk==1?"":"s"} completed · ${S.sess.length} total</p></div>

V.workout=()=>{let a=S.active;if(!a)return `<div class="eb">Choose a day</div><h1>Workout</h1><p class="mu">Pick any day, in any order.</p>${S.days.map((d,i)=>`<div class="card"><div class="row" style="flex-wrap:nowrap"><div><b style="${S.done.includes(i)?"text-decoration:line-through;text-decoration-thickness:2px;opacity:.55":""}">${esc(d.name)}</b><div class="mu">${d.items.length} exercises</div></div><button class="p n" data-a="start" data-i="${i}">Start</button></div></div>`).join("")||'<div class="card"><p class="mu">No days yet. Add some in More → Workout Builder.</p></div>'}`;
 let ok=a.items.filter(x=>x.ok).length,all=a.items.length>0&&ok==a.items.length;return `<div class="eb">${ok}/${a.items.length} done</div><h1>${esc(a.name)}</h1><svg class="wave" viewBox="0 0 300 36" preserveAspectRatio="none" role="img" aria-label="Session progress"><path class="t" pathLength="100" d="M2 18 C12 18 12 7 22 7 S32 29 42 29 S52 12 62 12 S72 23 82 23 S92 5 102 5 S112 30 122 30 S132 15 142 15 S152 25 162 25 S172 9 182 9 S192 28 202 28 S212 13 222 13 S232 22 242 22 S252 7 262 7 S272 29 282 29 S292 18 298 18"/><path class="f" pathLength="100" style="--w:${a.items.length?Math.round(ok/a.items.length*100):0}" d="M2 18 C12 18 12 7 22 7 S32 29 42 29 S52 12 62 12 S72 23 82 23 S92 5 102 5 S112 30 122 30 S132 15 142 15 S152 25 162 25 S172 9 182 9 S192 28 202 28 S212 13 222 13 S232 22 242 22 S252 7 262 7 S272 29 282 29 S292 18 298 18"/></svg>${a.items.map((x,j)=>`<label class="item ${x.ok?"done":""}"><input type="checkbox" data-ck="${j}" ${x.ok?"checked":""}><span>${esc(x.n)}</span></label>`).join("")||'<p class="mu">No exercises in this day. Add some in More → Workout Builder.</p>'}<div class="row" style="margin-top:14px"><button data-a="abandon">Discard</button><button class="p" data-a="finish" ${all?"":"disabled"}>Finish workout</button></div>`};
V.calendar=()=>{let y=calM.getFullYear(),m=calM.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),cells="";for(let i=0;i<f;i++)cells+="<span></span>";
 for(let d=1;d<=n;d++){let k=`${y}-${String(m+1).padStart(2,0)}-${String(d).padStart(2,0)}`,w=S.sess.some(s=>s.date===k),no=S.notes.some(x=>x.date===k);cells+=`<button data-d="${k}" class="${k===calSel?"sel":""}">${d}${w?'<i class="dot"></i>':""}${no?'<i class="dot n"></i>':""}</button>`}
 let ss=S.sess.filter(s=>s.date===calSel),nn=S.notes.filter(x=>x.date===calSel),ww=S.weights.filter(x=>x.date===calSel);
 return `<h1>Calendar</h1><div class="row"><button data-cm="-1">‹</button><b style="text-align:center">${calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button data-cm="1">›</button><button data-cm="0">Today</button></div><br><div class="cal">${"SMTWTFS".split("").map(c=>`<span class="mu">${c}</span>`).join("")}${cells}</div>
 <h2 style="margin-top:18px">${dl(calSel)}</h2>${ss.map(s=>`<div class="card"><b>${esc(s.day)}</b><p class="mu">${s.items.length} exercises${s.dur?` · ${s.dur} min`:""}</p>${s.items.map(x=>`<div class="mu">${esc(x.n)}${x.sets?.length?" — "+x.sets.filter(t=>t.r||t.w).map(t=>`${t.r||"?"}×${t.w||"–"}`).join(", "):""}</div>`).join("")}</div>`).join("")||'<p class="mu">No workout recorded.</p>'}
 ${ww.map(x=>`<div class="card">⚖ ${x.v} ${S.units}</div>`).join("")}${nn.map(noteCard).join("")}<button data-a="newnote" data-date="${calSel}">+ Add note</button>`};
const noteCard=x=>`<div class="card"><div class="row"><b>${x.pinned?"📌 ":""}${esc(x.title||"Note")}</b><span class="mu n" style="flex:0 0 auto">${dl(x.date)}</span></div><div class="mu">${(x.tags||[]).map(t=>"#"+esc(t)).join(" ")}</div><p style="white-space:pre-wrap">${esc(x.text)}</p><div class="row"><button data-pin="${x.id}">${x.pinned?"Unpin":"Pin"}</button><button data-en="${x.id}">Edit</button><button data-dn="${x.id}">Delete</button></div></div>`;
V.notes=()=>{if(edit&&edit.k==="note"){let x=edit.v;return `<h1>${x.ts?"Edit note":"New note"}</h1><input id="nt" placeholder="Title (optional)" value="${esc(x.title)}"><input id="nd" type="date" value="${x.date}"><input id="ng" placeholder="Tags, comma separated (optional)" value="${esc((x.tags||[]).join(", "))}"><textarea id="nx" rows="8" placeholder="Write…">${esc(x.text)}</textarea><div class="row"><button data-a="ncancel">Cancel</button><button class="p" data-a="nsave">Save</button></div>`}

const weightView=()=>{let W=[...S.weights].sort((a,b)=>a.date<b.date?-1:1),chart="";

 ${[...W].reverse().slice(0,8).map(x=>`<div class="card row"><span>${dl(x.date)}</span><b>${x.v} ${S.units}</b><button class="n" data-dw="${x.id}">✕</button></div>`).join("")}`};

function cropPhoto(file){return new Promise(async res=>{let bm;try{bm=await createImageBitmap(file)}catch(e){toast("Couldn't read that image");return res(null)}
 let Z=280,min=Z/Math.min(bm.width,bm.height),sc=min,ox=(Z-bm.width*sc)/2,oy=(Z-bm.height*sc)/2;
 let o=dlg(`<div style="text-align:center"><div class="eb">Crop photo</div><canvas width="${Z}" height="${Z}" style="width:${Z}px;max-width:100%;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab"></canvas><p class="mu">Drag to move, slide to zoom</p><input type="range" min="100" max="400" value="100" aria-label="Zoom"><div class="row"><button data-x="0">Cancel</button><button class="p" data-x="1">Use photo</button></div></div>`);
 let cv=o.querySelector("canvas"),g=cv.getContext("2d"),rg=o.querySelector("input[type=range]");
 const draw=()=>{ox=Math.min(0,Math.max(Z-bm.width*sc,ox));oy=Math.min(0,Math.max(Z-bm.height*sc,oy));g.fillStyle="#888";g.fillRect(0,0,Z,Z);g.drawImage(bm,ox,oy,bm.width*sc,bm.height*sc)};
 rg.oninput=()=>{let cx=(Z/2-ox)/sc,cy=(Z/2-oy)/sc;sc=min*rg.value/100;ox=Z/2-cx*sc;oy=Z/2-cy*sc;draw()};
 let dr=null;cv.onpointerdown=e=>{dr=[e.clientX,e.clientY,ox,oy];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dr)return;let k=Z/cv.getBoundingClientRect().width;ox=dr[2]+(e.clientX-dr[0])*k;oy=dr[3]+(e.clientY-dr[1])*k;draw()};cv.onpointerup=()=>dr=null;
 o.onclick=e=>{let x=e.target.closest("[data-x]")?.dataset.x;if(x===undefined)return;if(x==="1"){let c=document.createElement("canvas");c.width=c.height=256;let k=256/Z;c.getContext("2d").drawImage(bm,ox*k,oy*k,bm.width*sc*k,bm.height*sc*k);res(c.toDataURL("image/jpeg",.85))}else res(null);o.remove()};draw()})}

 if(d.dw){S.weights=S.weights.filter(x=>x.id!==d.dw);await save();render();return}
 if(d.tm){tm={mode:d.tm,run:false,end:0,left:90000,start:0,el:0,iv:tm.iv};render();return}
 if(d.tc){let c=d.tc;if(tm.mode!=="cd"){if(c==="start"){tm.start=Date.now();tm.run=true}else if(c==="pause"){tm.el+=Date.now()-tm.start;tm.run=false}else{tm.el=0;tm.run=false}}else{if(c==="start"&&tm.left>0){tm.end=Date.now()+tm.left;tm.run=true}else if(c==="pause"){tm.left=Math.max(0,tm.end-Date.now());tm.run=false}else if(c==="reset"){tm.run=false;tm.left=90000}}render();return}
 if(d.pre){let p=d.pre,cur=tm.run?tm.end-Date.now():tm.left;if(p==="c"){let v=+$("#cu").value;if(v>0)cur=v*1000;else return}else if(p[0]==="+"||p[0]==="-")cur=Math.max(0,cur+ +p*1000);else cur=+p*1000;tm.left=cur;if(tm.run)tm.end=Date.now()+cur;render();return}
 if(d.add!==undefined){addItem(+d.add);return}
 if(d.rx){parseDays();let[i,j]=d.rx.split(":").map(Number);S.days[i].items.splice(j,1);await save();render();return}
 if(d.pt){pt=d.pt;render();return}
 if(d.del){let[c,id]=d.del.split(":");S[c]=S[c].filter(x=>x.id!==id);await save();render();return}
 if(d.cmp){cmpSel=e.checked?[...cmpSel,d.cmp].slice(-2):cmpSel.filter(x=>x!==d.cmp);render();return}
 if(d.view){showPhotos([d.view]);return}
 if(d.dn2!==undefined)return;
 if(d.up){parseDays();let i=+d.up;if(i>0){[S.days[i-1],S.days[i]]=[S.days[i],S.days[i-1]];await save();render()}return}
 if(d.dup){parseDays();let i=+d.dup;S.days.splice(i+1,0,JSON.parse(JSON.stringify(S.days[i])));S.days[i+1].name+=" copy";await save();render();return}
 if(d.rm){if(await ask("Delete this day?","Delete")){parseDays();S.days.splice(+d.rm,1);S.done=[];await save();render()}return}
 if(!a)return;
 if(a==="start")startWorkout(+d.i);else if(a==="go"){tab="workout";render()}
 else if(a==="finish")finish();else if(a==="abandon"){if(await ask("Discard this session?","Discard")){S.active=null;await save();render()}}
 else if(a==="cycle"){S.done=[];await save();render()}
 else if(a==="newnote"){edit={k:"note",v:{title:"",text:"",date:d.date}};tab="notes";render()}
 else if(a==="ncancel"){edit=null;render()}
 else if(a==="nsave"){let x=edit.v,t=$("#nx").value.trim();if(!t&&!$("#nt").value.trim()){toast("Write something first");return}x.title=$("#nt").value.trim();x.text=t;x.tags=$("#ng").value.split(",").map(v=>v.trim().replace(/^#/,"")).filter(Boolean);x.date=$("#nd").value||today();if(x.id){Object.assign(S.notes.find(n=>n.id===x.id),x,{ts:Date.now()})}else S.notes.unshift({...x,id:Date.now()+"",ts:Date.now(),pinned:false});edit=null;await save();toast("Saved");render()}
 else if(a==="nsort"){S.nasc=!S.nasc;await save();render()}
 else if(a==="addw"){let v=+$("#wv").value;if(!(v>0)){toast("Enter a weight");return}S.weights.push({id:Date.now()+"",date:$("#wd").value||today(),v});await save();toast("Saved");render()}
 else if(a==="pick")$("#pfile").click();else if(a==="cam")$("#pcam").click();else if(a==="cmp"){if(cmpSel.length!==2){toast("Select two photos first");return}showPhotos(cmpSel)}else if(a==="pickav")$("#av").click();else if(a==="rmav"){S.avatar=null;await save();render()}
 else if(a==="addh"){let v=+$("#hv").value;if(!(v>0)){toast("Enter a height");return}S.heights.push({id:Date.now()+"",date:$("#hd").value||today(),v:Math.round((S.units==="lb"?v*2.54:v)*10)/10});await save();toast("Saved");render()}
 else if(a==="addf"){let v=+$("#fv").value;if(!(v>0&&v<70)){toast("Enter a percentage");return}S.fats.push({id:Date.now()+"",date:$("#fd").value||today(),v,method:$("#fm").value.trim()});await save();toast("Saved");render()}
 else if(a==="builder"){edit={k:"builder"};render()}else if(a==="addday"){parseDays();S.days.push({name:"Day "+(S.days.length+1),items:[]});render()}
 else if(a==="bdone"){parseDays();edit=null;S.done=S.done.filter(i=>i<S.days.length);await save();toast("Saved");render()}
 else if(a==="export")exportData();else if(a==="import")importDialog();
 else if(a==="obdone"){parseDays();S.onboarded=true;delete S.ob_n;await save();tab="home";render()}
 else if(a==="reset"){if(await ask("⚠️ Reset Local App Data?\n\nThis permanently deletes all workouts, history, notes and measurements on this device. Export a backup first if you might want them.","Continue")&&await ask("Last check: delete everything and start over?","Delete everything")){await DB.clear();localStorage.removeItem(OLD);S=blank();ob=0;tab="home";render()}}});
document.addEventListener("input",async e=>{let t=e.target;if(t.dataset.s){let[j,k,f]=t.dataset.s.split(":");S.active.items[j].sets[k][f]=t.value;clearTimeout(input.t);input.t=setTimeout(save,400)}else if(t.id==="nq"){edit={...(edit||{}),q:t.value};let p=t.selectionStart;render();let n=$("#nq");n.focus();n.setSelectionRange(p,p)}});function input(){}
document.addEventListener("change",async e=>{let t=e.target;if(t.id==="sm"){S.mode=t.value;theme();await save()}else if(t.id==="pn"){S.name=t.value.trim();await save()}else if(t.id==="pu"){S.units=t.value;await save();toast("Saved")}
 else if(t.id==="pfl"){pfl=t.value;render()}else if(t.id==="pfile"||t.id==="pcam")addPhoto(t.files[0]);else if(t.id==="av")setAvatar(t.files[0]);else if(t.id==="ntag"){edit={...(edit||{}),tag:t.value};render()}else if(["ivw","ivr","ivn"].includes(t.id)){tm.iv={w:+$("#ivw").value||30,r:+$("#ivr").value||0,n:Math.max(1,+$("#ivn").value||1)};tm.el=0;tm.run=false;tm.ph=undefined;render()}
 else if(t.id==="imp"&&t.files[0]){try{let j=JSON.parse(await t.files[0].text());if(j.app!=="baffled-aesthetic"||!j.state)throw 0;S={...blank(),...j.state};for(const[k,v]of Object.entries(j.photos||{}))await DB.set(k,await(await fetch(v)).blob());await save();toast("Restored");render()}catch(x){toast("Not a valid backup file")}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.ni!==undefined)addItem(+e.target.dataset.ni)});
init();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
