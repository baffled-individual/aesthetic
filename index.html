 let el=tm.el+(tm.run?n-tm.start:0);if(tm.mode==="sw")return fm(Math.floor(el/1000));
 let c=tm.iv,cy=(c.w+c.r)*1000,tot=cy*c.n;if(el>=tot){if(tm.run){tm.run=false;tm.el=0;beep()}return "Done"}
